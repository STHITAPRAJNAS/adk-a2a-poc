# OPA (Open Policy Agent) — one instance, two jobs:
#   :9191  gRPC ext_authz   → Envoy Gateway asks "allow this request?" (network layer)
#   :8181  REST /v1/data    → agents ask "allow this tool call?"      (application layer)
#
# Both policies live in one ConfigMap so the whole decision surface is in one file.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opa-policies
  namespace: agents
data:
  opa-conf.yaml: |
    # Turns on the Envoy external-authorization gRPC plugin and points it at the
    # `allow` rule in package envoy.authz.
    plugins:
      envoy_ext_authz_grpc:
        addr: ":9191"
        path: envoy/authz/allow
    decision_logs:
      console: true          # every allow/deny prints to `kubectl logs` — great for the lab

  envoy.rego: |
    # NETWORK layer: enforced by Envoy Gateway (ext_authz) BEFORE traffic reaches
    # an agent. OPA sees the HTTP request attributes, not the agent internals.
    package envoy.authz
    import rego.v1

    default allow := false

    # Card/readiness GETs are always fine.
    allow if { input.attributes.request.http.method == "GET" }

    # A2A calls (POST) must carry an x-change-ticket header — policy-as-code at
    # the front door. No header, no entry (Envoy returns 403).
    allow if {
      input.attributes.request.http.method == "POST"
      input.attributes.request.http.headers["x-change-ticket"] != ""
    }

  tools.rego: |
    # APPLICATION layer: queried by each agent's before_tool_callback (Stage 2)
    # over REST at /v1/data/tools/allow. This is where OPA controls *which tools
    # and skills an agent may actually run*, regardless of what the LLM decided.
    package tools
    import rego.v1

    default allow := false

    # A call is allowed if a base rule permits it AND the service is not frozen.
    allow if {
      base_allow
      not frozen
    }

    # ── Change freeze ────────────────────────────────────────────────────────
    # No tool may touch a frozen service, whoever asks. This blocks at the FIRST
    # tool (check_release_readiness), so it's the easy one to demo — no approval
    # dance needed. Try: "deploy billing-worker 3.1.0 to production".
    frozen_services := {"billing-worker"}
    frozen if input.args.service in frozen_services

    # ── Base permissions ─────────────────────────────────────────────────────
    # ops_concierge may ONLY ever delegate to deployment_agent — nothing else.
    base_allow if {
      input.agent == "ops_concierge"
      input.tool == "transfer_to_agent"
      input.args.agent_name == "deployment_agent"
    }

    # deployment_agent may run its read-only / approval tools freely.
    base_allow if {
      input.agent == "deployment_agent"
      input.tool in {"check_release_readiness", "run_compliance_scan", "request_change_approval"}
    }

    # ...but it may only START a deployment when the target is NOT production.
    # Production deploys are blocked at the tool boundary by policy, full stop.
    base_allow if {
      input.agent == "deployment_agent"
      input.tool == "start_deployment"
      input.args.environment != "production"
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opa
  namespace: agents
  labels: { app: opa }
spec:
  replicas: 1
  selector:
    matchLabels: { app: opa }
  template:
    metadata:
      labels:
        app: opa
        # Keep OPA OUT of the ambient mesh: it's reached both by the out-of-mesh
        # gateway (ext_authz gRPC) and by the in-mesh agents (REST). Staying
        # plaintext avoids an HBONE-mismatch on the gateway->OPA hop.
        istio.io/dataplane-mode: none
    spec:
      containers:
        - name: opa
          # NOTE (Apple Silicon): the plain `-envoy` tag is amd64-ONLY and fails
          # on arm64 with "no match for platform in manifest". The `-envoy-static`
          # variant is multi-arch (arm64 + amd64) and otherwise identical. Pinned
          # to a real version for repeatability.
          image: openpolicyagent/opa:1.20.2-envoy-static
          args:
            - "run"
            - "--server"
            - "--addr=:8181"
            - "--config-file=/config/opa-conf.yaml"
            # A ConfigMap volume also exposes hidden ..data / ..<timestamp>
            # symlink dirs; without this OPA loads each policy 3x and refuses to
            # start with "multiple default rules". Ignore dotfiles/dirs so only
            # the real envoy.rego + tools.rego are loaded once.
            - "--ignore=.*"
            - "/policies"
          ports:
            - { name: grpc, containerPort: 9191 }
            - { name: rest, containerPort: 8181 }
          volumeMounts:
            - { name: config,   mountPath: /config }
            - { name: policies, mountPath: /policies }
          readinessProbe:
            httpGet: { path: /health, port: rest }
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: opa-policies
            items:
              - { key: opa-conf.yaml, path: opa-conf.yaml }
        - name: policies
          configMap:
            name: opa-policies
            items:
              - { key: envoy.rego, path: envoy.rego }
              - { key: tools.rego, path: tools.rego }
---
apiVersion: v1
kind: Service
metadata:
  name: opa
  namespace: agents
spec:
  selector: { app: opa }
  ports:
    - { name: grpc, port: 9191, targetPort: grpc }
    - { name: rest, port: 8181, targetPort: rest }
