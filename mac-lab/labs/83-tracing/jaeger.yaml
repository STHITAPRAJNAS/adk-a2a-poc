# Jaeger v2, all-in-one: an OTLP receiver, in-memory storage and the UI in one
# pod. Plenty for a lab; it forgets everything on restart. Multi-arch image, so
# the same manifest runs on amd64 (Windows/WSL2) and arm64 (Apple Silicon).
#
#   kubectl apply -f labs/83-tracing/jaeger.yaml
#
# Outside the agents namespace on purpose: the collector is shared
# infrastructure, not part of the agent network, and it stays out of the mesh.
apiVersion: v1
kind: Namespace
metadata:
  name: observability
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: observability
  labels: {app: jaeger}
spec:
  replicas: 1
  selector:
    matchLabels: {app: jaeger}
  template:
    metadata:
      labels: {app: jaeger}
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/jaeger:2.21.0
          ports:
            - {name: otlp-http, containerPort: 4318}
            - {name: otlp-grpc, containerPort: 4317}
            - {name: ui, containerPort: 16686}
          readinessProbe:
            httpGet: {path: /, port: ui}
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: observability
spec:
  selector: {app: jaeger}
  ports:
    - {name: otlp-http, port: 4318, targetPort: otlp-http}
    - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc}
    - {name: ui, port: 16686, targetPort: ui}
