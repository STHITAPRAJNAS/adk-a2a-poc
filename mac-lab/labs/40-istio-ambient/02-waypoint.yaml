# A waypoint is where L7 lives in ambient. Deploy one, point a namespace or a
# service at it, and HTTP-aware features switch on for that traffic only.
#
# This is the seam sidecars hide: with a sidecar you get L4 and L7 together and
# pay for both everywhere. Here you opt in.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: agents-waypoint
  namespace: agents
  labels:
    istio.io/waypoint-for: service
spec:
  gatewayClassName: istio-waypoint
  listeners:
    - name: mesh
      port: 15008
      protocol: HBONE
