<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ops Concierge over AG-UI</title>
<style>
  :root {
    --paper: #f7f6f2; --panel: #ffffff; --panel-2: #f0eee8; --ink: #1d1d1b; --muted: #6b6a66;
    --rule: #dcd9d0; --pod0: #2a4fb8; --pod1: #0a7a5c; --err: #b3261e; --err-bg: #fbe9e7;
    --ok: #1d7a3a; --ok-bg: #e5f3e9; --warn: #a35f00; --warn-bg: #fbeed7;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #161614; --panel: #1f1f1c; --panel-2: #2a2a26; --ink: #ecebe6; --muted: #a3a29c;
      --rule: #3a3a35; --pod0: #8aa6ff; --pod1: #5fd0ad; --err: #ff8a80; --err-bg: #3a1d1a;
      --ok: #7ed39a; --ok-bg: #1b3022; --warn: #e8a63d; --warn-bg: #36270f; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.5 system-ui, -apple-system, sans-serif; }
  header { padding: 14px 16px; border-bottom: 1px solid var(--rule); display: flex; flex-wrap: wrap; gap: 10px; align-items: baseline; }
  header h1 { font-size: 17px; margin: 0; }
  .muted { color: var(--muted); } .mono { font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; }
  main { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 16px; padding: 16px; max-width: 1200px; margin: 0 auto; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
  section { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 12px; display: grid; gap: 10px; align-content: start; min-width: 0; }
  h2 { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button { font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--rule); background: var(--panel-2); color: var(--ink); cursor: pointer; }
  button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  button:disabled { opacity: .5; cursor: default; }
  input[type=text] { font: inherit; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--rule); background: var(--panel); color: var(--ink); flex: 1; min-width: 180px; }
  select { font: inherit; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--rule); background: var(--panel); color: var(--ink); }
  .chat { display: grid; gap: 8px; max-height: 52vh; overflow-y: auto; padding: 4px; }
  .msg { padding: 8px 11px; border-radius: 10px; max-width: 92%; overflow-wrap: anywhere; border: 1px solid var(--rule); }
  .msg.user { justify-self: end; background: var(--panel-2); }
  .msg.assistant { justify-self: start; }
  .msg .via { font-size: 11.5px; margin-top: 4px; }
  .pod0 { color: var(--pod0); font-weight: 600; } .pod1 { color: var(--pod1); font-weight: 600; }
  .note { padding: 8px 10px; border-radius: 6px; font-size: 13px; }
  .note.err { background: var(--err-bg); color: var(--ink); border: 1px solid var(--err); }
  .note.ok { background: var(--ok-bg); color: var(--ink); border: 1px solid var(--ok); }
  .note.info { background: var(--panel-2); }
  .stored { display: grid; gap: 4px; }
  .stored div { padding: 4px 8px; border-radius: 4px; border-left: 3px solid var(--rule); font-size: 13px; overflow-wrap: anywhere; }
  .stored div.dup { border-left-color: var(--err); background: var(--err-bg); }
  .log { max-height: 30vh; overflow-y: auto; white-space: pre-wrap; background: var(--panel-2); padding: 8px; border-radius: 6px; margin: 0; }
</style>
</head>
<body>
<header>
  <h1>Ops Concierge over AG-UI</h1>
  <span class="muted">reproducing <a href="https://github.com/ag-ui-protocol/ag-ui/issues/2603">ag-ui#2603</a>: a turn answered on one replica is answered again on another</span>
</header>
<main>
  <section>
    <h2>Conversation</h2>
    <div class="row mono"><span>thread</span><span id="thread"></span><button id="new">New thread</button></div>
    <div class="row">
      <label for="route">Route each run to</label>
      <select id="route">
        <option value="alternate">pod 0, pod 1, pod 0, … (deterministic)</option>
        <option value="lb">the load balancer (Service, random)</option>
        <option value="pod0">always pod 0</option>
        <option value="pod1">always pod 1</option>
      </select>
    </div>
    <div class="chat" id="chat"></div>
    <div class="row">
      <input type="text" id="text" value="What can you do?" aria-label="Message">
      <button class="primary" id="send">Send</button>
      <button id="reconnect" title="Re-run with the history the page already has and nothing new, as a page does after a refresh or a dropped connection">Reconnect</button>
    </div>
    <div id="status" class="note info">Send a question, then a second one, then press Reconnect.</div>
  </section>
  <section>
    <h2>What the shared session stored</h2>
    <div id="verdict" class="note info">Nothing yet.</div>
    <div class="stored" id="stored"></div>
    <h2>AG-UI events, last run</h2>
    <pre class="log mono" id="log"></pre>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
