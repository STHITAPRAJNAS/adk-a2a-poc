[project]
name = "adk-a2a-poc"
version = "0.1.0"
description = "Google ADK + A2A proof of concept: two agents wired over the A2A protocol, served with get_fast_api_app, demonstrating human-in-the-loop and long-running task behaviour."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk[a2a]==2.8.0",
    "a2a-sdk==1.1.2",
    "python-dotenv>=1.0",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["common", "servers"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
