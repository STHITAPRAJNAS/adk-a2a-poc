# Three pods that demonstrate the scheduler's three answers: yes, no, and
# not yet. Apply them all, then read `kubectl get pods -o wide`.
---
# 1. YES — lands on the GPU pool.
# Needs all three: a selector to aim at the pool, a toleration to get past the
# taint, and a resource request the node can satisfy. Drop any one and watch.
apiVersion: v1
kind: Pod
metadata:
  name: gpu-job-good
  namespace: scheduling-lab
  labels: { lab.local/demo: "gpu-good" }
spec:
  restartPolicy: Never
  nodeSelector:
    lab.local/pool: gpu
  tolerations:
    - key: lab.local/accelerator
      operator: Equal
      value: simulated
      effect: NoSchedule
  containers:
    - name: work
      image: busybox:1.36
      command: ["sh", "-c", "echo scheduled on $NODE_NAME; sleep 3600"]
      env:
        - name: NODE_NAME
          valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
      resources:
        limits:
          lab.local/gpu: 1
---
# 2. NO — Pending forever.
# Correct selector, correct resource, NO toleration. The taint repels it.
# `kubectl describe pod gpu-job-no-toleration` says so in one line.
apiVersion: v1
kind: Pod
metadata:
  name: gpu-job-no-toleration
  namespace: scheduling-lab
  labels: { lab.local/demo: "gpu-no-tol" }
spec:
  restartPolicy: Never
  nodeSelector:
    lab.local/pool: gpu
  containers:
    - name: work
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      resources:
        limits:
          lab.local/gpu: 1
---
# 3. NOT YET — Pending until capacity frees up.
# Everything correct, but asks for more accelerator units than the pool has.
# This is the one worth sitting with: it is indistinguishable from #2 in
# `kubectl get pods`, and completely different in `describe`.
apiVersion: v1
kind: Pod
metadata:
  name: gpu-job-too-greedy
  namespace: scheduling-lab
  labels: { lab.local/demo: "gpu-greedy" }
spec:
  restartPolicy: Never
  nodeSelector:
    lab.local/pool: gpu
  tolerations:
    - key: lab.local/accelerator
      operator: Equal
      value: simulated
      effect: NoSchedule
  containers:
    - name: work
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      resources:
        limits:
          lab.local/gpu: 99
