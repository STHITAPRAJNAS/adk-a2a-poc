# Open WebUI — a ChatGPT-style browser UI for the in-cluster Ollama.
#
# Ollama serves only an API; this is the chat front end. It is a plain web app
# (no GPU), talks to Ollama over cluster DNS, and you reach it by port-forward.
#
#   kubectl apply -f open-webui.yaml
#   kubectl -n llm rollout status deploy/open-webui   # first pull is a few GB
#   kubectl -n llm port-forward svc/open-webui 3000:8080
#   # then open http://localhost:3000 on Windows and pick a model (qwen2.5:7b)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: llm
  labels: { app: open-webui }
spec:
  replicas: 1
  selector:
    matchLabels: { app: open-webui }
  template:
    metadata:
      labels: { app: open-webui }
    spec:
      # No GPU request and no toleration, so the scheduler keeps it off the
      # tainted GPU node automatically — it lands on a general worker.
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:main
          ports:
            - name: http
              containerPort: 8080
          env:
            # Point the UI at Ollama's in-cluster Service (<svc>.<namespace>).
            - name: OLLAMA_BASE_URL
              value: "http://ollama.llm:11434"
            # Lab convenience: skip the sign-up/login wall. Only safe because
            # this is reachable solely through your own port-forward. Do NOT do
            # this on anything actually exposed.
            - name: WEBUI_AUTH
              value: "false"
            # Do RAG embeddings via Ollama instead of loading a local
            # sentence-transformer at boot — lighter and faster to start.
            - name: RAG_EMBEDDING_ENGINE
              value: "ollama"
          resources:
            requests:
              cpu: "250m"
              memory: 1Gi
            limits:
              # 1Gi OOM-kills it during startup (it loads models into memory);
              # 3Gi boots cleanly.
              memory: 3Gi
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
      volumes:
        # Chat history + settings. emptyDir = wiped if the pod is recreated;
        # swap for a PVC (kind has a default StorageClass) to keep it.
        - name: data
          emptyDir:
            sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: llm
spec:
  selector: { app: open-webui }
  ports:
    - name: http
      port: 8080
      targetPort: http
