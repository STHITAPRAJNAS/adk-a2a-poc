# A GatewayClass names an implementation; a Gateway is an instance of one.
# Splitting them is what lets a platform team own the class and app teams own
# gateways, which is the main thing Gateway API fixed about Ingress.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  # Without this the EnvoyProxy below is an inert object: defining it is not
  # enough, the class has to point at it.
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: nodeport-proxy
    namespace: agents
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: north-south
  namespace: agents
spec:
  gatewayClassName: envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.localhost"
      allowedRoutes:
        namespaces:
          from: Same
---
# Pin the generated Envoy Service to the NodePorts kind mapped to host
# 8080/8443 in lab 10. Without this the Service is a LoadBalancer that never
# gets an address on kind, and you would be back to port-forward — which
# tunnels straight past the gateway and tests nothing.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: nodeport-proxy
  namespace: agents
spec:
  provider:
    type: Kubernetes
    kubernetes:
      # Put the ingress proxy INTO the ambient mesh. The backends it fronts
      # (ops-concierge) are ambient-captured and only accept HBONE (mTLS); a
      # plaintext hop from outside the mesh is held open by ztunnel and hangs.
      # Enrolling the proxy makes its backend hop HBONE, which ztunnel accepts.
      # This is the "gateway joins the mesh" step — the doorway still faces
      # outward, but it now speaks the mesh's language on the inside.
      envoyDeployment:
        pod:
          labels:
            istio.io/dataplane-mode: ambient
      envoyService:
        type: NodePort
        patch:
          type: StrategicMerge
          value:
            spec:
              ports:
                # A StrategicMerge on a Service's ports list keys on `port`
                # (the patchMergeKey), NOT on `name`. Omit it and the merge is
                # rejected with "does not contain declared merge key: port",
                # the Envoy Service is never finalized, the proxy gets no
                # endpoints, xDS times out on ClusterLoadAssignment, and every
                # request is reset. The Gateway has only an http:80 listener,
                # so that is the one port to pin to the host-mapped nodePort.
                - port: 80
                  nodePort: 30080
