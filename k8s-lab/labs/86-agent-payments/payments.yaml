  # One replica: each service keeps its state (checkouts, tokens, budget used)
  # in memory, which is fine for a lab and wrong for production.
  replicas: 1
  selector:
    matchLabels: {app: acme-approvals}
  template:
    metadata:
      labels: {app: acme-approvals, lab: "86"}
    spec:
      containers:
        - name: trusted-surface
          image: adk-a2a-agent:dev
          imagePullPolicy: IfNotPresent
          # Acme: the page where a person approves (Trusted Surface)
          args: ["payments.server", "trusted-surface"]
          ports:
            - {name: http, containerPort: 8413}
          env:
            - {name: HOST, value: "0.0.0.0"}
            - {name: PORT, value: "8413"}
            - {name: AP2_MERCHANT_URL, value: "http://northwind-sales.agents.svc.cluster.local:8410"}
            - {name: AP2_CREDENTIAL_PROVIDER_URL, value: "http://acme-wallet.agents.svc.cluster.local:8411"}
            - {name: AP2_PROCESSOR_URL, value: "http://northwind-payments.agents.svc.cluster.local:8412"}
            - {name: AP2_TRUSTED_SURFACE_URL, value: "http://acme-approvals.agents.svc.cluster.local:8413"}
