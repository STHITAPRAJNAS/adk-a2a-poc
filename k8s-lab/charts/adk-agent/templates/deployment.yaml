apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "adk-agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "adk-agent.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "adk-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "adk-agent.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}{{- toYaml . | nindent 8 }}{{- end }}
      annotations:
        # Roll the pods when a card changes. Without this, editing a ConfigMap
        # updates the mounted file eventually but the process has already read
        # it, and you debug a stale card for twenty minutes.
        checksum/cards: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}{{- toYaml . | nindent 8 }}{{- end }}
    spec:
      serviceAccountName: {{ include "adk-agent.serviceAccountName" . }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["{{ .Values.serverModule }}"]
          ports:
            - name: http-a2a
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          env:
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- if .Values.apiKeySecret.name }}
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.apiKeySecret.name }}
                  key: {{ .Values.apiKeySecret.key }}
            {{- end }}
            # Useful in logs and in mesh telemetry when you are working out
            # which replica answered.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          {{- if .Values.probes.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: http-a2a
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: http-a2a
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: http-a2a
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            # readOnlyRootFilesystem is on, so anything the process writes needs
            # a volume. ADK's local session store lives under /tmp.
            - name: tmp
              mountPath: /tmp
            {{- if .Values.peerAgentCards }}
            - name: cards
              mountPath: /etc/a2a
              readOnly: true
            {{- end }}
            {{- if .Values.servedAgentCard }}
            # subPath mounts a single file over the image's card without hiding
            # the rest of the package directory.
            - name: cards
              mountPath: /app/{{ .Values.agentPackageDir }}/{{ .Values.appName }}/agent.json
              subPath: served-agent-card.json
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}{{- toYaml . | nindent 12 }}{{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if or .Values.servedAgentCard .Values.peerAgentCards }}
        - name: cards
          configMap:
            name: {{ include "adk-agent.fullname" . }}-cards
        {{- end }}
        {{- with .Values.extraVolumes }}{{- toYaml . | nindent 8 }}{{- end }}
